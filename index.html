<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0d0d0d;
    padding:20px;
    color:#f5f5f5;
}

.card{
    width:100%;
    max-width:500px;
    background:#161616;
    border:1px solid #ff5ca8;
    border-radius:16px;
    padding:40px;
    box-shadow:0 10px 30px rgba(255,92,168,0.15);
}

.avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#ff5ca8;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:600;
    margin-bottom:24px;
}

h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:8px;
}

.role{
    color:#ff8cc3;
    font-size:16px;
    margin-bottom:30px;
}

.section{
    margin-top:24px;
}

.section h2{
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#ff8cc3;
    margin-bottom:12px;
}

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.skill{
    padding:8px 14px;
    background:#222;
    border:1px solid #ff5ca8;
    border-radius:6px;
    font-size:14px;
}

p{
    line-height:1.7;
    color:#d8d8d8;
}
</style>
</head>
<body>

<div class="card">
    <div class="avatar">NA</div>

    <h1>Nurul Athirah Binti Suliman</h1>
    <p class="role">IT</p>

    <div class="section">
        <h2>Skills</h2>
        <div class="skills">
            <span class="skill">Linux</span>
            <span class="skill">Git</span>
        </div>
    </div>

    <div class="section">
        <h2>About Me</h2>
        <p>
            I am a lifelong learner who enjoys exploring data, automation and new technologies.
        </p>
    </div>
</div>

</body>
</html>
