<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nurul Athirah Portfolio</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        background:#0f172a;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        color:#f8fafc;
        padding:20px;
    }

    .card{
        width:100%;
        max-width:420px;
        background:#1e293b;
        border:1px solid #334155;
        border-radius:20px;
        padding:35px;
        text-align:center;
        box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    .avatar{
        width:100px;
        height:100px;
        border-radius:50%;
        background:#3b82f6;
        margin:0 auto 20px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:36px;
        font-weight:bold;
    }

    h1{
        font-size:1.8rem;
        margin-bottom:8px;
    }

    .role{
        color:#60a5fa;
        font-weight:600;
        margin-bottom:25px;
    }

    .section{
        margin-top:20px;
        text-align:left;
    }

    .section h2{
        font-size:1rem;
        color:#93c5fd;
        margin-bottom:10px;
    }

    .skills{
        display:flex;
        gap:10px;
        flex-wrap:wrap;
    }

    .skill{
        background:#334155;
        padding:8px 14px;
        border-radius:999px;
        font-size:0.9rem;
    }

    .fact{
        line-height:1.7;
        color:#cbd5e1;
    }
</style>
</head>

<body>

<div class="card">
    <div class="avatar">NA</div>

    <h1>Nurul Athirah Binti Suliman</h1>
    <p class="role">IT Consultant</p>

    <div class="section">
        <h2>Skills</h2>
        <div class="skills">
            <span class="skill">Linux</span>
            <span class="skill">Git</span>
        </div>
    </div>

    <div class="section">
        <h2>About Me</h2>
        <p class="fact">
            I am a lifelong learner who enjoys exploring data,
            automation and new technologies.
        </p>
    </div>
</div>

</body>
</html>
